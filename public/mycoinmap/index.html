<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyCoinMap</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFE9; --surface:#FFFFFF; --surface-2:#F5F7F2; --surface-3:#EDF0EA;
  --line:#D8DDD2; --line-2:#E6EAE1;
  --ink:#16201B; --ink-2:#4B5750; --ink-3:#7C877F;
  --accent:#1E6B4E; --accent-2:#2C8A66; --accent-soft:#DDEDE4; --accent-ink:#FFFFFF;
  --side:#0F2A1F; --side-2:#153A2B; --side-ink:#DCE8E0; --side-ink-2:#8FAE9D;
  --brass:#B27F2C; --brass-soft:#F4E9D3; --brass-ink:#5E3F0C;
  --good:#2E7D4F; --good-soft:#DCEFE3;
  --warn:#B9701A; --warn-soft:#F8E9D2;
  --bad:#B7382C; --bad-soft:#F7DCD8;
  --info:#2F62A8; --info-soft:#DCE6F5;
  --violet:#6B4FB3; --violet-soft:#E6DFF5;
  --teal:#1F7F85; --teal-soft:#D8EEF0;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 8px 24px -12px rgba(22,32,27,.18);
  --shadow-lg:0 24px 60px -20px rgba(22,32,27,.35);
  --radius:12px; --radius-sm:8px;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1310; --surface:#151C18; --surface-2:#1A2320; --surface-3:#202B26;
    --line:#2A3630; --line-2:#222D28;
    --ink:#E6ECE7; --ink-2:#A8B4AC; --ink-3:#71807A;
    --accent:#3FA97A; --accent-2:#5CC094; --accent-soft:#1B3328; --accent-ink:#06120C;
    --side:#0A1712; --side-2:#12231B; --side-ink:#DCE8E0; --side-ink-2:#7E9A8C;
    --brass:#D6A44E; --brass-soft:#3A2D14; --brass-ink:#F1D9A6;
    --good:#4CBF7E; --good-soft:#173324;
    --warn:#E0973A; --warn-soft:#3A2A12;
    --bad:#E0655A; --bad-soft:#3D1D1A;
    --info:#6C9BE0; --info-soft:#1B2A40;
    --violet:#A48BEA; --violet-soft:#2A2340;
    --teal:#4FB8BF; --teal-soft:#153336;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#151C18; --surface-2:#1A2320; --surface-3:#202B26;
  --line:#2A3630; --line-2:#222D28;
  --ink:#E6ECE7; --ink-2:#A8B4AC; --ink-3:#71807A;
  --accent:#3FA97A; --accent-2:#5CC094; --accent-soft:#1B3328; --accent-ink:#06120C;
  --side:#0A1712; --side-2:#12231B; --side-ink:#DCE8E0; --side-ink-2:#7E9A8C;
  --brass:#D6A44E; --brass-soft:#3A2D14; --brass-ink:#F1D9A6;
  --good:#4CBF7E; --good-soft:#173324;
  --warn:#E0973A; --warn-soft:#3A2A12;
  --bad:#E0655A; --bad-soft:#3D1D1A;
  --info:#6C9BE0; --info-soft:#1B2A40;
  --violet:#A48BEA; --violet-soft:#2A2340;
  --teal:#4FB8BF; --teal-soft:#153336;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.serif{font-family:var(--serif);font-weight:400}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--brass),#7E5A1C);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:20px;line-height:1;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.brand-name{font-family:var(--serif);font-size:24px;letter-spacing:.01em;color:#fff}
.brand-sub{font-size:11px;color:var(--side-ink-2);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:transparent;color:var(--side-ink);border-radius:9px;text-align:left;font-weight:600;font-size:13.5px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:var(--side-2)}
.nav button.active{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav button .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--side-ink-2)}
.nav button .cnt.hot{color:#fff;background:var(--bad);padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-ink-2)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(76,191,126,.2)}
.sync .dot.local{background:var(--warn);box-shadow:0 0 0 3px rgba(224,151,58,.2)}
.me-chip{display:flex;align-items:center;gap:10px;background:var(--side-2);border:0;border-radius:10px;padding:8px 10px;color:#fff;width:100%;text-align:left}
.me-chip .av{background:var(--brass);color:#fff}
.me-chip small{display:block;color:var(--side-ink-2);font-weight:500}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 28px 0;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;letter-spacing:.005em;text-wrap:balance}
.top .sub{font-size:13px;color:var(--ink-3);margin-top:-2px}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;min-width:240px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--ink-3)}
.view{padding:22px 28px 40px;display:flex;flex-direction:column;gap:22px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;white-space:nowrap;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.icon{width:38px;padding:0;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 12px;width:100%}
.field textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .span{grid-column:1/-1}
.form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.new{background:var(--info-soft);color:var(--info)}
.pill.contacted{background:var(--teal-soft);color:var(--teal)}
.pill.visit_scheduled{background:var(--violet-soft);color:var(--violet)}
.pill.visited{background:var(--accent-soft);color:var(--accent)}
.pill.follow_up{background:var(--warn-soft);color:var(--warn)}
.pill.booked{background:var(--brass-soft);color:var(--brass-ink)}
.pill.deal_done{background:var(--good-soft);color:var(--good)}
.pill.lost{background:var(--surface-3);color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}
.tag.sample{background:var(--warn-soft);color:var(--warn)}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:800;flex:none;letter-spacing:.02em}
.av.sm{width:22px;height:22px;font-size:9.5px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
.card-h h2{margin:0;font-size:15px;font-weight:800}
.card-h .grow{flex:1}
.card-b{padding:14px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:16px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:112px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.kpi .num{font-family:var(--serif);font-size:40px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:auto}
.kpi .foot b{color:var(--ink-2)}
.kpi.hot .num{color:var(--bad)}
.kpi.gold{background:linear-gradient(160deg,var(--brass-soft),var(--surface) 70%)}
.kpi.gold .num{color:var(--brass-ink)}
.kpi .ico{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3)}
.kpi .ico svg{width:15px;height:15px}
.two{display:grid;grid-template-columns:1.25fr .9fr;gap:18px;align-items:start}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:130px 1fr 36px;gap:12px;align-items:center;font-size:12.5px}
.frow .bar{height:22px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.frow .bar i{display:block;height:100%;border-radius:6px;min-width:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.frow .n{text-align:right;font-family:var(--mono);font-weight:600}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:0}
.row:hover .name{color:var(--accent)}
.row .name{font-weight:700}
.row .meta{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:0}
.row .when{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.row .when.over{color:var(--bad);font-weight:600}
.row .when.today{color:var(--warn);font-weight:600}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px;font-family:var(--serif);font-weight:400;font-size:20px}
.feed{display:flex;flex-direction:column}
.feed .row{cursor:pointer}
.feed .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.feed .ico svg{width:15px;height:15px}
.feed .txt{font-size:13px}
.feed .txt b{font-weight:700}
.feed .txt .note{color:var(--ink-2)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tr.lead{cursor:pointer}
tr.lead:hover td{background:var(--surface-2)}
td .name{font-weight:700}
td .sub{font-size:12px;color:var(--ink-3)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:12.5px;font-weight:600}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:262px;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-3);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px;border:1px dashed transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-size:12.5px;font-weight:800}
.col-h .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600}
.col-h .sum{font-family:var(--mono);font-size:11px;color:var(--brass-ink);background:var(--brass-soft);padding:1px 6px;border-radius:5px}
.kcard{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);cursor:grab;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.kcard:hover{transform:translateY(-1px)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kcard .t b{font-weight:800}
.kcard .t .mono{font-size:11px;color:var(--ink-3)}
.kcard .m{font-size:12px;color:var(--ink-2)}
.kcard .f{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-top:2px}
.kcard .f .av{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}
.chip svg{width:11px;height:11px}
.chip.over{background:var(--bad-soft);color:var(--bad)}
.chip.today{background:var(--warn-soft);color:var(--warn)}
.chip.soon{background:var(--violet-soft);color:var(--violet)}
.chip.brass{background:var(--brass-soft);color:var(--brass-ink)}

/* plots */
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plot{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);border-top:4px solid var(--good)}
.plot.booked{border-top-color:var(--brass)}
.plot.sold{border-top-color:var(--ink-3);opacity:.85}
.plot .no{font-family:var(--serif);font-size:24px;line-height:1}
.plot .sz{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.plot .pr{font-weight:800;font-size:13px}
.plot .st{font-size:11px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-top:2px}
.plot .st i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.plot.booked .st{color:var(--brass-ink)} .plot.booked .st i{background:var(--brass)}
.plot.sold .st i{background:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.member{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.member .h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.member .h b{font-size:15px}
.member .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.member .stat{background:var(--surface-2);border-radius:8px;padding:8px}
.member .stat .v{font-family:var(--serif);font-size:22px;line-height:1}
.member .stat .k{font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);backdrop-filter:blur(2px);z-index:40;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:50;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .2s cubic-bezier(.2,.8,.2,1)}
.drawer-h{padding:20px 22px 14px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.drawer-h .r1{display:flex;align-items:flex-start;gap:12px}
.drawer-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.drawer-h .phone{font-family:var(--mono);font-size:14px;color:var(--ink-2);text-decoration:none}
.drawer-h .r2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.drawer-b{overflow:auto;padding:18px 22px 30px;display:flex;flex-direction:column;gap:18px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 6px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2)}
.actions button svg{width:18px;height:18px}
.actions button:hover{background:var(--surface-3);color:var(--ink)}
.actions button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.actions button.gold.on{background:var(--brass-soft);border-color:var(--brass);color:var(--brass-ink)}
.actions button.bad.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.aform{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.aform h3{margin:0;font-size:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--surface-2);border-radius:9px;padding:10px 12px}
.fact .k{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fact .v{font-weight:700;margin-top:3px}
.fact .v.mono{font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.tl:first-child{border-top:0}
.tl .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.tl .ico svg{width:15px;height:15px}
.tl .w{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.tl .w b{font-weight:800}
.tl .w .by{font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-family:var(--mono)}
.tl .note{font-size:13px;color:var(--ink-2);margin-top:2px;white-space:pre-wrap}
.ico.call{background:var(--teal-soft);color:var(--teal)}
.ico.text,.ico.whatsapp{background:var(--info-soft);color:var(--info)}
.ico.visit_scheduled{background:var(--violet-soft);color:var(--violet)}
.ico.visited{background:var(--accent-soft);color:var(--accent)}
.ico.follow_up{background:var(--warn-soft);color:var(--warn)}
.ico.booked{background:var(--brass-soft);color:var(--brass-ink)}
.ico.deal_done{background:var(--good-soft);color:var(--good)}
.ico.lost{background:var(--bad-soft);color:var(--bad)}
.ico.note,.ico.created,.ico.stage,.ico.edit{background:var(--surface-3);color:var(--ink-2)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal .box{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow-lg);padding:22px 24px;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.modal h2{margin:0 0 14px;font-family:var(--serif);font-weight:400;font-size:26px}
.modal .box>p{margin:0 0 14px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:70;box-shadow:var(--shadow-lg);animation:pop .18s}
.hint{font-size:12px;color:var(--ink-3)}
.modal .box.wide{width:min(980px,100%)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s;display:block}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.drop input{display:none}
.steps{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.step{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink-3)}
.step.on{color:var(--ink);font-weight:700}
.step.done{color:var(--good)}
.step .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;flex:none}
.step.on .dot{background:currentColor;animation:pulse 1.2s infinite}
.step.done .dot{background:currentColor}
@keyframes pulse{50%{opacity:.35}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumbs img{height:92px;border-radius:6px;border:1px solid var(--line);background:#fff}
.rev td{padding:6px 8px}.rev th{padding:8px}
.rev input,.rev select{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;width:100%;font-size:12.5px}
.rev input.num{font-family:var(--mono);text-align:right}
.rev tr.low td{background:var(--warn-soft)}
.rev tr.off td{opacity:.45}
.rev tr.off td:first-child{opacity:1}
.sumline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.sumline b{color:var(--ink)}

@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes pop{from{transform:scale(.97) translateY(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;padding:6px 8px;flex-direction:row;gap:0;z-index:30;border-top:1px solid var(--side-2)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;padding:7px 4px;font-size:10px;justify-content:center}
  .nav button .cnt{display:none}
  .nav button.active{box-shadow:inset 0 -2px 0 var(--brass)}
  .nav button.hide-m{display:none}
  .top{padding:16px 16px 0}.view{padding:16px 16px 90px}
  .search{min-width:0;width:100%}
  .form-grid{grid-template-columns:1fr}
  .actions{grid-template-columns:repeat(3,1fr)}
  .top h1{font-size:26px}
}
</style>
</head>

</div>

const now = () => new Date();
const pad = n => String(n).padStart(2,'0');
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const daysFromToday = d => Math.round((startOfDay(d) - startOfDay(now())) / 86400000);
const isToday = d => !!d && dayKey(d) === dayKey(now());
const sameMonth = d => { const a = new Date(d), b = now(); return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); };
const withinDays = (d, n) => { const k = daysFromToday(d); return k <= 0 && k > -n; };
const toLocalInput = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`; };

const fmtRel = d => { const k = daysFromToday(d); if (k === 0) return 'Today'; if (k === 1) return 'Tomorrow'; if (k === -1) return 'Yesterday'; if (k < 0) return `${-k}d ago`; if (k < 7) return DAY[new Date(d).getDay()]; return fmtDate(d); };
const fmtAgo = d => { const s = (now() - new Date(d)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s/60)}m ago`; if (s < 86400 && isToday(d)) return `${Math.floor(s/3600)}h ago`; return fmtRel(d); };
const fmtINR = n => { n = Number(n) || 0; if (n >= 1e7) return `₹${(n/1e7).toFixed(n % 1e7 ? 2 : 0)} Cr`; if (n >= 1e5) return `₹${(n/1e5).toFixed(n % 1e5 ? 1 : 0)} L`; return `₹${n.toLocaleString('en-IN')}`; };

const SB_URL = 'https://ddpzkrytljgjathmzhak.supabase.co';

const plotFromRow = r => { const sq = Number(r.area_sqft) || Math.round(Number(r.ganda_size) * GANDA); return { id:String(r.id), number:String(r.plot_number), site:r.site || '17 Kani', sizeSqft:sq, areaValue:Number(r.ganda_size) || null, areaUnit:'ganda', pricePerSqft: sq ? Number(r.price_lakhs) * 1e5 / sq : 0, facing:cap(r.facing || ''), status:r.status === 'reserved' ? 'booked' : (r.status || 'available'), rawStatus:r.status, leadId:r.lead_id || '', widthFt:r.width_ft ? Number(r.width_ft) : null, depthFt:r.depth_ft ? Number(r.depth_ft) : null, note:r.notes || '' }; };
const rowFromPlot = p => { const n = parseInt(String(p.number).replace(/\D/g, ''), 10); return { plot_number:n, ganda_size:+(p.areaUnit === 'ganda' && p.areaValue ? Number(p.areaValue) : p.sizeSqft / GANDA).toFixed(2), area_sqft:Math.round(p.sizeSqft), status:p.status, price_lakhs:+(((Number(p.pricePerSqft) || 0) * p.sizeSqft) / 1e5).toFixed(2), facing:(p.facing || '').toLowerCase() || null, notes:p.note || null, lead_id:p.leadId || null, site:p.site || '17 Kani', width_ft:p.widthFt || null, depth_ft:p.depthFt || null, updated_at:new Date().toISOString() }; };
const leadFromRow = r => ({ id:r.id, name:r.name, phone:r.phone, source:r.source || '', stage:r.stage, interest:r.interest || '', budget:Number(r.budget) || 0, assignedTo:r.assigned_to || '', notes:r.notes || '', nextFollowUp:r.next_follow_up || '', visitAt:r.visit_at || '', plotId:r.plot_id ? String(r.plot_id) : '', tokenAmount:Number(r.token_amount) || 0, dealAmount:Number(r.deal_amount) || 0, activities:Array.isArray(r.activities) ? r.activities : [], sample:!!r.sample, createdAt:r.created_at, updatedAt:r.updated_at });
const rowFromLead = l => ({ id:l.id, name:l.name, phone:l.phone, source:l.source || null, stage:l.stage, interest:l.interest || null, budget:l.budget || 0, assigned_to:l.assignedTo || null, notes:l.notes || null, next_follow_up:l.nextFollowUp || null, visit_at:l.visitAt || null, plot_id:l.plotId ? parseInt(l.plotId, 10) : null, token_amount:l.tokenAmount || 0, deal_amount:l.dealAmount || 0, activities:l.activities || [], sample:!!l.sample, created_at:l.createdAt || new Date().toISOString(), updated_at:l.updatedAt || new Date().toISOString() });
const moneyFromRow = r => ({ id:r.id, kind:r.kind, amount:Number(r.amount) || 0, paidBy:r.paid_by || '', category:r.category || '', on:r.on_date ? r.on_date + 'T12:00:00' : r.created_at, note:r.note || '', leadId:r.lead_id || '', plotId:r.plot_id ? String(r.plot_id) : '', by:r.logged_by || '', createdAt:r.created_at, sample:!!r.sample });
const rowFromMoney = m => ({ id:m.id, kind:m.kind, amount:m.amount, paid_by:m.paidBy, category:m.category || null, on_date:dayKey(m.on), note:m.note || null, lead_id:m.leadId || null, plot_id:m.plotId ? parseInt(m.plotId, 10) : null, logged_by:m.by || null, sample:!!m.sample });

const Store = {
  async init(){
    const { data } = await sb.auth.getSession(); SESSION = data.session;
    sb.auth.onAuthStateChange((_ev, s) => { const had = !!SESSION; SESSION = s; if (!!s !== had) location.reload(); });
    state.ready = true;
    if (!SESSION) { showLogin(); return; }
    await this.loadPartner();
    if (!PARTNER) { showNotPartner(); return; }
    ME = PARTNER.name; state.mode = 'db';
    await this.loadAll(); render(); this.subscribe();
  },
  async loadPartner(){ const { data } = await sb.from('crm_partners').select('*').eq('user_id', SESSION.user.id).maybeSingle(); PARTNER = data || null; },
  async loadAll(){
    const [l, p, m, s, t, i] = await Promise.all([sb.from('crm_leads').select('*'), sb.from('plots').select('*').order('plot_number'), sb.from('crm_money').select('*'), sb.from('crm_settings').select('*'), sb.from('crm_partners').select('*').order('created_at'), sb.from('crm_invites').select('*')]);
    for (const r of [l, p, m, s, t, i]) if (r.error) dbErr(r.error);
    state.leads = (l.data || []).map(leadFromRow); state.plots = (p.data || []).map(plotFromRow); state.money = (m.data || []).map(moneyFromRow);
    const prefs = (s.data || []).find(x => x.key === 'prefs'); state.prefs = { areaUnit:'ganda', ...(prefs ? prefs.value : {}) };
    state.partners = t.data || []; state.invites = i.data || [];
    state.team = [...new Set([...state.partners.map(x => x.name), ...state.invites.map(x => x.name), ...state.leads.map(x => x.assignedTo), ...state.money.map(x => x.paidBy)].filter(Boolean))];
  },
  subscribe(){ let timer; const refresh = () => { clearTimeout(timer); timer = setTimeout(async () => { await this.loadAll(); render(); }, 300); };
    sb.channel('mycoinmap').on('postgres_changes', { event:'*', schema:'public' }, refresh).subscribe(); },
  async putLead(lead){
    lead.updatedAt = new Date().toISOString();
    const i = state.leads.findIndex(l => l.id === lead.id); if (i >= 0) state.leads[i] = lead; else state.leads.push(lead);
    render(); const { error } = await sb.from('crm_leads').upsert(rowFromLead(lead)); if (error) dbErr(error);
  },
  async deleteLead(id){ state.leads = state.leads.filter(l => l.id !== id); render(); const { error } = await sb.from('crm_leads').delete().eq('id', id); if (error) dbErr(error); },
  async putPlot(plot){
    const row = rowFromPlot(plot); if (!row.plot_number) return toast('Plot number must contain a number, e.g. 12.');
    const i = state.plots.findIndex(p => p.id === plot.id);
    if (i >= 0) { state.plots[i] = plot; render(); const { error } = await sb.from('plots').update(row).eq('id', Number(plot.id)); if (error) dbErr(error); }
    else { const { data, error } = await sb.from('plots').insert(row).select().single(); if (error) return dbErr(error); state.plots.push(plotFromRow(data)); render(); }
  },
  async deletePlot(id){ state.plots = state.plots.filter(p => p.id !== id); render(); const { error } = await sb.from('plots').delete().eq('id', Number(id)); if (error) dbErr(error); },
  async putMoney(m){
    const i = state.money.findIndex(x => x.id === m.id); if (i >= 0) state.money[i] = m; else state.money.push(m);
    render(); const { error } = await sb.from('crm_money').upsert(rowFromMoney(m)); if (error) dbErr(error);
  },
  async deleteMoney(id){ state.money = state.money.filter(m => m.id !== id); render(); const { error } = await sb.from('crm_money').delete().eq('id', id); if (error) dbErr(error); },
  async putPrefs(prefs){ state.prefs = { ...state.prefs, ...prefs }; render(); const { error } = await sb.from('crm_settings').upsert({ key:'prefs', value:state.prefs }); if (error) dbErr(error); },
  async putTeam(members){ state.team = [...new Set(members)]; render(); },
  async invite(name, email){ const { error } = await sb.from('crm_invites').insert({ name, email:email.toLowerCase(), invited_by:ME }); if (error) return dbErr(error); await this.loadAll(); render(); },
  async removeInvite(email){ const { error } = await sb.from('crm_invites').delete().eq('email', email); if (error) return dbErr(error); await this.loadAll(); render(); },
  async removePartner(userId){ const { error } = await sb.from('crm_partners').delete().eq('user_id', userId); if (error) return dbErr(error); await this.loadAll(); render(); },
  async signOut(){ await sb.auth.signOut(); location.reload(); }
};
function dbErr(e){
  const msg = (e && e.message) || '';
  if (/row-level security|permission denied/i.test(msg)) toast('You are not allowed to do that. Ask the owner to add you as a partner.');
  else if (/duplicate key.*plot_number/i.test(msg)) toast('A plot with that number already exists.');
  else if (/plots_facing_check/i.test(msg)) toast('Facing must be North, South, East, West or Corner.');
  else toast('Could not save. Check your connection and try again.');
  console.warn(e);
}
function showLogin(mode){
  ui.locked = true; mode = mode || 'in';
  $('#overlay').innerHTML = `<div class="modal"><div class="box" data-stop="1" style="width:min(420px,100%)"><h2>${mode === 'in' ? 'Sign in to MyCoinMap' : 'Create your password'}</h2><p>${mode === 'in' ? 'Use the email your partner invited you with.' : 'Use the email you were invited with. A confirmation email will follow.'}</p>
    <form id="loginForm" data-mode="${mode}" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input name="password" type="password" required minlength="6" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}"></div>
    <div class="hint" id="loginMsg"></div><button class="btn primary" type="submit" style="justify-content:center">${mode === 'in' ? 'Sign in' : 'Create account'}</button></form>
    <p class="hint" style="margin:14px 0 0;text-align:center">${mode === 'in' ? 'First time here? <a href="#" data-login-mode="up">Create your password</a>' : 'Already have a password? <a href="#" data-login-mode="in">Sign in</a>'}</p></div></div>`;

/* ===================== derived ===================== */
function allActs(){
  const out = [];
  for (const l of state.leads) for (const a of (l.activities || [])) out.push({ ...a, lead:l });
  out.sort((a,b) => new Date(b.at) - new Date(a.at));
  return out;
}
function isOpen(l){ return OPEN_STAGES.includes(l.stage); }
function followUpsDue(){
  return state.leads.filter(l => l.nextFollowUp && isOpen(l) && daysFromToday(l.nextFollowUp) <= 0)
    .sort((a,b) => new Date(a.nextFollowUp) - new Date(b.nextFollowUp));
}
function visitsUpcoming(){
  return state.leads.filter(l => l.visitAt && l.stage === 'visit_scheduled' && daysFromToday(l.visitAt) >= 0)
    .sort((a,b) => new Date(a.visitAt) - new Date(b.visitAt));
}
function matches(l, q){
  if (!q) return true; q = q.toLowerCase();
  const p = plotById(l.plotId);
  return [l.name, l.phone, l.source, l.interest, l.assignedTo, l.notes, p && plotLabel(p)].some(v => v && String(v).toLowerCase().includes(q));
}
function lastAct(l){ const a = l.activities || []; return a.length ? a[a.length-1] : null; }

function render(){
  renderNav(); renderSync();
  const titles = { today:['Today', fmtDate(now()) + ' · ' + (ME ? `Good ${now().getHours()<12?'morning':now().getHours()<17?'afternoon':'evening'}, ${ME.split(' ')[0]}` : 'Sign in to continue')],
    board:['Pipeline','Drag a card to move it to the next stage'], leads:['All leads','Every enquiry, newest activity first'],

/* ---- Today ---- */
function vToday(){
  const acts = allActs();
  const callsToday = acts.filter(a => a.type==='call' && isToday(a.at)).length;
  const msgsToday  = acts.filter(a => (a.type==='text'||a.type==='whatsapp') && isToday(a.at)).length;
  const callsWeek  = acts.filter(a => a.type==='call' && withinDays(a.at,7)).length;
  const visitsUp   = visitsUpcoming();
  const visitedWk  = acts.filter(a => a.type==='visited' && withinDays(a.at,7)).length;
  const due        = followUpsDue(); const overdue = due.filter(l => daysFromToday(l.nextFollowUp) < 0).length;
  const booked     = state.leads.filter(l => l.stage==='booked');
  const dealsM     = acts.filter(a => a.type==='deal_done' && sameMonth(a.at));
  const dealSum    = dealsM.reduce((s,a) => s + (Number(a.amount)||0), 0);
  const newWeek    = state.leads.filter(l => withinDays(l.createdAt,7)).length;
  const funnelMax  = Math.max(1, ...STAGES.filter(s => s.id!=='lost').map(s => state.leads.filter(l => l.stage===s.id).length));

  const agenda = [
    ...visitsUp.filter(l => daysFromToday(l.visitAt) <= 1).map(l => ({ l, kind:'visit', at:l.visitAt })),
    ...due.map(l => ({ l, kind:'follow', at:l.nextFollowUp }))
  ].sort((a,b) => new Date(a.at) - new Date(b.at));

  return `
  <div class="kpis">
    ${kpi('Calls today', callsToday, `<b>${callsWeek}</b> this week`, 'phone')}
    ${kpi('Messages today', msgsToday, `SMS + WhatsApp`, 'msg')}
    ${kpi('Visits scheduled', visitsUp.length, `<b>${visitedWk}</b> visited this week`, 'pin')}
    ${kpi('Follow-ups due', due.length, overdue ? `<b style="color:var(--bad)">${overdue} overdue</b>` : 'all on time', 'bell', due.length ? 'hot' : '')}
    ${kpi('New leads', newWeek, 'last 7 days', 'spark')}
    ${kpi('Booked', booked.length, `${fmtINR(booked.reduce((s,l)=>s+(Number(l.tokenAmount)||0),0))} token received`, 'bookmark')}
    ${kpi('Deals this month', dealsM.length, `<b>${fmtINR(dealSum)}</b> closed`, 'trophy', 'gold')}
    ${kpi('Plots left', state.plots.filter(p => p.status==='available').length, `of ${state.plots.length} in inventory`, 'grid')}
  </div>
  <div class="two">
    <div class="card">
      <div class="card-h"><h2>Today's agenda</h2><span class="muted">${agenda.length ? agenda.length + ' items' : ''}</span><div class="grow"></div>
        <button class="btn sm ghost" data-go="follow">All follow-ups</button></div>
      <div class="card-b"><div class="list">
        ${agenda.length ? agenda.map(({l,kind,at}) => `
          <div class="row" data-open="${l.id}">
            <span class="ico ${kind==='visit'?'visit_scheduled':'follow_up'}" style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none">${kind==='visit'?I.pin:I.bell}</span>
            <div class="grow"><div class="name">${esc(l.name)}</div>
              <div class="meta"><span>${kind==='visit'?'Site visit':'Follow-up'}</span>·<span class="mono">${esc(fmtPhone(l.phone))}</span>${l.interest?`·<span>${esc(l.interest)}</span>`:''}${l.assignedTo?`·<span>${esc(l.assignedTo)}</span>`:''}</div></div>
            <div class="when ${daysFromToday(at)<0?'over':isToday(at)?'today':''}">${kind==='visit'?fmtTime(at):fmtRel(at)}</div>
          </div>`).join('') : `<div class="empty"><b>Nothing due today</b>Schedule a visit or set a follow-up from any lead.</div>`}
      </div></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Pipeline</h2><div class="grow"></div><button class="btn sm ghost" data-go="board">Open board</button></div>
      <div class="card-b"><div class="funnel">
        ${STAGES.filter(s => s.id!=='lost').map(s => { const n = state.leads.filter(l => l.stage===s.id).length; return `<div class="frow"><span>${s.label}</span><div class="bar"><i style="width:${Math.round(n/funnelMax*100)}%;background:${s.color}"></i></div><span class="n">${n}</span></div>`; }).join('')}
        <div class="frow" style="color:var(--ink-3)"><span>Lost</span><div></div><span class="n">${state.leads.filter(l=>l.stage==='lost').length}</span></div>
      </div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Recent activity</h2><span class="muted">across the team</span></div>
    <div class="card-b"><div class="feed">
      ${acts.length ? acts.slice(0,14).map(a => feedRow(a)).join('') : `<div class="empty"><b>No activity yet</b>Add your first lead, then log every call, message and visit from the lead's page.${state.mode==='local'?'<br><br><button class="btn sm" data-seed="1">Load sample leads to explore</button>':''}</div>`}
    </div></div>
  </div>`;
}
function kpi(label, n, foot, icon, cls=''){ return `<div class="kpi ${cls}"><div class="lbl">${label}</div><div class="num">${n}</div><div class="foot">${foot}</div><span class="ico">${I[icon]}</span></div>`; }
function feedRow(a){
  const m = ACTS[a.type] || ACTS.note; const l = a.lead;
  let txt = `<b>${esc(a.by||'Someone')}</b> ${m.past} <b>${esc(l.name)}</b>`;
  if (a.type==='stage') txt = `<b>${esc(a.by||'Someone')}</b> moved <b>${esc(l.name)}</b> to ${esc(stageOf(a.to).label)}`;
  if (a.type==='visit_scheduled' && a.visitAt) txt += ` <span class="mono">${fmtDT(a.visitAt)}</span>`;
  if (a.type==='follow_up' && a.followUpAt) txt += ` <span class="mono">${fmtRel(a.followUpAt)}</span>`;
  if (a.type==='booked' && a.plotId) txt += ` · ${esc(plotLabel(plotById(a.plotId)) || 'plot')}`;
  if (a.type==='deal_done' && a.amount) txt += ` · <b>${fmtINR(a.amount)}</b>`;
  return `<div class="row" data-open="${l.id}"><span class="ico ${a.type}">${I[m.icon]}</span><div class="grow txt">${txt}${a.note?`<div class="note">${esc(a.note)}</div>`:''}</div><span class="when muted">${fmtAgo(a.at)}</span></div>`;
}

/* ---- Board ---- */
function vBoard(){
  const q = ui.q;
  return `<div class="board">${STAGES.map(s => {
    const items = state.leads.filter(l => l.stage===s.id && matches(l,q)).sort((a,b) => new Date(b.updatedAt||0) - new Date(a.updatedAt||0));
    const sum = s.id==='deal_done' ? items.reduce((x,l)=>x+(Number(l.dealAmount)||0),0) : s.id==='booked' ? items.reduce((x,l)=>x+(plotPrice(plotById(l.plotId))||0),0) : 0;
    return `<div class="col" data-stage="${s.id}"><div class="col-h"><span style="width:8px;height:8px;border-radius:50%;background:${s.color}"></span>${s.label}${sum?`<span class="sum">${fmtINR(sum)}</span>`:''}<span class="n">${items.length}</span></div>
      ${items.map(kcard).join('')}${items.length?'':'<div class="empty" style="padding:18px 6px">Drop a lead here</div>'}</div>`;
  }).join('')}</div>`;
}
function kcard(l){
  const p = plotById(l.plotId);
  let chip = '';
  if (l.stage==='visit_scheduled' && l.visitAt) chip = `<span class="chip ${daysFromToday(l.visitAt)<0?'over':isToday(l.visitAt)?'today':'soon'}">${I.pin}${fmtRel(l.visitAt)} ${fmtTime(l.visitAt)}</span>`;
  else if (l.nextFollowUp && isOpen(l)) chip = `<span class="chip ${daysFromToday(l.nextFollowUp)<0?'over':isToday(l.nextFollowUp)?'today':''}">${I.bell}${fmtRel(l.nextFollowUp)}</span>`;
  else if (p) chip = `<span class="chip brass">${I.grid}${esc(plotLabel(p))}</span>`;
  return `<article class="kcard" draggable="true" data-id="${l.id}" data-open="${l.id}">
    <div class="t"><b>${esc(l.name)}</b><span class="mono">${esc(fmtPhone(l.phone))}</span></div>
    <div class="m">${esc(l.interest || l.source || '')}${l.budget?` · ${fmtINR(l.budget)}`:''}</div>
    <div class="f">${chip}${l.sample?'<span class="tag sample">sample</span>':''}${l.assignedTo?`<span class="av sm" title="${esc(l.assignedTo)}">${esc(initials(l.assignedTo))}</span>`:''}</div>
  </article>`;
}

/* ---- Leads ---- */
function vLeads(){
  let rows = state.leads.filter(l => matches(l, ui.q));
  if (ui.filterStage) rows = rows.filter(l => l.stage === ui.filterStage);
  if (ui.filterWho) rows = rows.filter(l => l.assignedTo === ui.filterWho);
  rows.sort((a,b) => new Date(b.updatedAt||0) - new Date(a.updatedAt||0));
  return `<div class="card">
    <div class="card-h"><div class="filters">
      <select data-filter="stage"><option value="">All stages</option>${STAGES.map(s=>`<option value="${s.id}" ${ui.filterStage===s.id?'selected':''}>${s.label}</option>`).join('')}</select>
      <select data-filter="who"><option value="">Everyone</option>${state.team.map(m=>`<option ${ui.filterWho===m?'selected':''}>${esc(m)}</option>`).join('')}</select>
      <span class="muted">${rows.length} of ${state.leads.length}</span></div><div class="grow"></div>
      <button class="btn sm" id="exportBtn" hidden>${I.download}Export CSV</button></div>

      ${rows.map(l => { const a = lastAct(l); const p = plotById(l.plotId);

}

/* ---- Visits ---- */
function vVisits(){
  const up = visitsUpcoming();
  const past = allActs().filter(a => a.type==='visited');

  for (const l of up) (groups[dayKey(l.visitAt)] ||= []).push(l);
  return `<div class="seg" style="align-self:flex-start"><button class="${ui.visitsTab==='upcoming'?'on':''}" data-vtab="upcoming">Upcoming · ${up.length}</button><button class="${ui.visitsTab==='done'?'on':''}" data-vtab="done">Completed · ${past.length}</button></div>
  ${ui.visitsTab==='upcoming' ? (Object.keys(groups).length ? Object.keys(groups).sort().map(k => `<div class="card"><div class="card-h"><h2>${fmtDate(groups[k][0].visitAt)}</h2><span class="muted">${fmtRel(groups[k][0].visitAt)}</span></div><div class="card-b"><div class="list">
      ${groups[k].map(l => `<div class="row" data-open="${l.id}"><span class="when" style="width:74px;text-align:left">${fmtTime(l.visitAt)}</span><div class="grow"><div class="name">${esc(l.name)}</div><div class="meta"><span class="mono">${esc(fmtPhone(l.phone))}</span>${l.interest?`·<span>${esc(l.interest)}</span>`:''}${l.assignedTo?`·<span>with ${esc(l.assignedTo)}</span>`:''}</div></div>
        <button class="btn sm" data-quick="visited" data-lead="${l.id}">${I.check}Mark visited</button></div>`).join('')}</div></div></div>`).join('')

/* ---- Follow-ups ---- */
function vFollow(){

  const stale = state.leads.filter(l => isOpen(l) && !l.nextFollowUp && !(l.stage==='visit_scheduled'&&l.visitAt) && daysFromToday(l.updatedAt||l.createdAt) <= -3).sort((a,b)=>new Date(a.updatedAt||0)-new Date(b.updatedAt||0));
  const row = l => `<div class="row" data-open="${l.id}"><span class="av">${esc(initials(l.name))}</span><div class="grow"><div class="name">${esc(l.name)}</div><div class="meta"><span class="pill ${l.stage}">${stageOf(l.stage).label}</span><span class="mono">${esc(fmtPhone(l.phone))}</span>${l.interest?`·<span>${esc(l.interest)}</span>`:''}${l.assignedTo?`·<span>${esc(l.assignedTo)}</span>`:''}</div></div>
    ${l.nextFollowUp?`<div class="when ${daysFromToday(l.nextFollowUp)<0?'over':isToday(l.nextFollowUp)?'today':''}">${fmtRel(l.nextFollowUp)}</div>`:`<div class="when muted">quiet ${-daysFromToday(l.updatedAt||l.createdAt)}d</div>`}
    <a class="btn sm icon" href="${telHref(l.phone)}" title="Call" data-stop="1">${I.phone}</a><a class="btn sm icon" href="${waHref(l.phone)}" target="_blank" rel="noopener" title="WhatsApp" data-stop="1">${I.wa}</a></div>`;

    <div class="card"><div class="card-h"><h2>Coming up</h2><span class="muted">${later.length}</span></div><div class="card-b"><div class="list">${later.length?later.map(row).join(''):`<div class="empty"><b>Nothing scheduled</b></div>`}</div></div></div>

/* ---- Money ---- */
const monthKey = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}`; };
const monthLabel = k => { const [y,m] = k.split('-'); return `${MON[Number(m)-1]} ${y}`; };
const sum = (arr, f) => arr.reduce((s,x) => s + (Number(f ? f(x) : x)||0), 0);
function vMoney(){
  const all = [...state.money].sort((a,b) => new Date(b.on) - new Date(a.on));
  const partners = [...new Set([...state.team, ...all.map(m => m.paidBy).filter(Boolean)])];
  const months = [...new Set(all.map(m => monthKey(m.on)))].sort().reverse();
  const invested = sum(all.filter(m => m.kind==='investment'), m => m.amount);
  const spent = sum(all.filter(m => m.kind==='expense'), m => m.amount);
  const spentMonth = sum(all.filter(m => m.kind==='expense' && sameMonth(m.on)), m => m.amount);
  const putIn = all.length ? invested + spent : 0;
  const share = partners.length ? putIn / partners.length : 0;
  const rows = all.filter(m => (!ui.moneyWho || m.paidBy===ui.moneyWho) && (!ui.moneyKind || m.kind===ui.moneyKind) && (!ui.moneyMonth || monthKey(m.on)===ui.moneyMonth) && (!ui.q || [m.note, m.category, m.paidBy].some(v => v && String(v).toLowerCase().includes(ui.q.toLowerCase()))));
  const cats = EXPENSE_CATS.map(c => ({ c, v: sum(all.filter(m => m.kind==='expense' && m.category===c), m => m.amount) })).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  const catMax = Math.max(1, ...cats.map(x => x.v));
  const top = partners.map(pn => ({ pn, v: sum(all.filter(m => m.paidBy===pn), m => m.amount) })).sort((a,b) => b.v - a.v)[0];
  return `<div class="kpis">
    ${kpi('Invested', fmtINR(invested), 'capital put in by partners', 'rupee', 'gold')}
    ${kpi('Spent', fmtINR(spent), `<b>${fmtINR(spentMonth)}</b> this month`, 'download')}
    ${kpi('Total put in', fmtINR(putIn), `equal share <b>${fmtINR(share)}</b> each`, 'users')}
    ${kpi('Entries', all.length, top && top.v ? `most from <b>${esc(top.pn)}</b>` : 'no entries yet', 'note')}
  </div>
  <div class="two">
    <div class="card"><div class="card-h"><h2>Partner ledger</h2><span class="muted">equal split across ${partners.length} partner${partners.length===1?'':'s'}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Partner</th><th style="text-align:right">Invested</th><th style="text-align:right">Spent</th><th style="text-align:right">Put in</th><th style="text-align:right">Balance</th></tr></thead><tbody>
        ${partners.map(pn => { const inv = sum(all.filter(m => m.paidBy===pn && m.kind==='investment'), m => m.amount), sp = sum(all.filter(m => m.paidBy===pn && m.kind==='expense'), m => m.amount), tot = inv + sp, bal = tot - share;
          return `<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="av sm">${esc(initials(pn))}</span><b>${esc(pn)}</b></span></td><td class="mono" style="text-align:right">${fmtINR(inv)}</td><td class="mono" style="text-align:right">${fmtINR(sp)}</td><td class="mono" style="text-align:right;font-weight:700">${fmtINR(tot)}</td>
          <td class="mono" style="text-align:right;font-weight:700;color:${Math.abs(bal)<1?'var(--ink-3)':bal>0?'var(--good)':'var(--bad)'}">${Math.abs(bal)<1?'settled':(bal>0?'+':'−')+fmtINR(Math.abs(bal))}</td></tr>`; }).join('')}
        ${partners.length?'':'<tr><td colspan="5"><div class="empty"><b>No partners yet</b>Add partners on the Team screen.</div></td></tr>'}
      </tbody></table></div><div class="card-b hint">Balance is what each partner has put in compared with an equal share of the total. Plus means the others owe them; minus means they owe the pool.</div></div>
    <div class="card"><div class="card-h"><h2>Where the money went</h2></div><div class="card-b"><div class="funnel">
      ${cats.length ? cats.map(x => `<div class="frow" style="grid-template-columns:150px 1fr 74px"><span>${esc(x.c)}</span><div class="bar"><i style="width:${Math.round(x.v/catMax*100)}%;background:var(--brass)"></i></div><span class="n">${fmtINR(x.v)}</span></div>`).join('') : `<div class="empty"><b>No expenses yet</b></div>`}
    </div></div></div>
  </div>
  <div class="card"><div class="card-h"><div class="filters">
      <select data-filter="moneyWho"><option value="">All partners</option>${partners.map(pn=>`<option ${ui.moneyWho===pn?'selected':''}>${esc(pn)}</option>`).join('')}</select>
      <select data-filter="moneyKind"><option value="">Expenses + investments</option><option value="expense" ${ui.moneyKind==='expense'?'selected':''}>Expenses only</option><option value="investment" ${ui.moneyKind==='investment'?'selected':''}>Investments only</option></select>
      <select data-filter="moneyMonth"><option value="">All months</option>${months.map(k=>`<option value="${k}" ${ui.moneyMonth===k?'selected':''}>${monthLabel(k)}</option>`).join('')}</select>
      <span class="muted">${rows.length} entries · ${fmtINR(sum(rows, m => m.amount))}</span></div><div class="grow"></div>
      <button class="btn sm" id="exportMoneyBtn" hidden>${I.download}Export CSV</button><button class="btn sm primary" id="addMoneyBtn">${I.plus}Add entry</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Paid by</th><th>Type</th><th>For</th><th>Note</th><th style="text-align:right">Amount</th></tr></thead><tbody>
      ${rows.map(m => { const l = leadById(m.leadId), p = plotById(m.plotId);
        return `<tr class="lead" data-money="${m.id}"><td class="mono">${fmtDate(m.on)}<div class="sub">${new Date(m.on).getFullYear()}</div></td>
        <td><span style="display:inline-flex;align-items:center;gap:7px"><span class="av sm">${esc(initials(m.paidBy))}</span>${esc(m.paidBy||'—')}</span></td>
        <td><span class="pill ${m.kind==='investment'?'booked':'contacted'}">${m.kind==='investment'?'Investment':'Expense'}</span></td>
        <td>${esc(m.kind==='investment'?'Capital':(m.category||'—'))}${l?`<div class="sub">${esc(l.name)}</div>`:p?`<div class="sub">${esc(plotLabel(p))}</div>`:''}</td>
        <td style="white-space:normal;max-width:320px">${esc(m.note||'')}<div class="sub">logged by ${esc(m.by||'')}</div></td>
        <td class="mono" style="text-align:right;font-weight:700">${fmtINR(m.amount)}</td></tr>`; }).join('')}
      ${rows.length?'':`<tr><td colspan="6"><div class="empty"><b>Nothing recorded yet</b>Add the first expense or investment. Every entry is tagged with who paid.</div></td></tr>`}
    </tbody></table></div></div>`;
}

function moneyCsv(){
  const H = ['Date','Type','Paid by','Category','Amount','Note','Lead','Plot','Logged by'];

function captureInputs(root){ const m = new Map(); $$('#actForm [name]', root).forEach(el => m.set(el.name, el.value)); return m; }
function restoreInputs(root, m){ if (!m.size) return; $$('#actForm [name]', root).forEach(el => { if (m.has(el.name)) el.value = m.get(el.name); }); }

/* ===================== actions ===================== */
function logAct(l, act){
  act.id = uid(); act.at = act.at || new Date().toISOString(); act.by = act.by || ME || 'Unknown';
  l.activities = [...(l.activities||[]), act];
}
async function submitAction(l, t, f){
  const v = n => f.elements[n] ? f.elements[n].value.trim() : '';
  const act = { type:t, note:[v('outcome'), v('note')].filter(Boolean).join(' — ') };
  const lead = { ...l };
  const fuDate = v('followUpAt') ? new Date(v('followUpAt') + 'T10:00:00').toISOString() : '';
  if (t==='call'||t==='text'||t==='whatsapp'){
    if (fuDate) { act.followUpAt = fuDate; lead.nextFollowUp = fuDate; }
    if (lead.stage==='new') lead.stage = 'contacted';
  } else if (t==='visit_scheduled'){
    if (!v('visitAt')) return toast('Pick a visit date and time.');
    act.visitAt = new Date(v('visitAt')).toISOString(); lead.visitAt = act.visitAt; lead.stage = 'visit_scheduled';
    if (v('who')) { act.note = `With ${v('who')}${act.note?' — '+act.note:''}`; if (!lead.assignedTo) lead.assignedTo = v('who'); }
  } else if (t==='visited'){
    act.at = v('at') ? new Date(v('at')).toISOString() : new Date().toISOString();
    if (v('liked')) act.note = `Liked ${v('liked')}${act.note?' — '+act.note:''}`;
    lead.visitAt = ''; lead.stage = 'visited';
    if (fuDate) { act.followUpAt = fuDate; lead.nextFollowUp = fuDate; }
  } else if (t==='follow_up'){
    if (!fuDate) return toast('Pick a follow-up date.');
    act.followUpAt = fuDate; lead.nextFollowUp = fuDate; lead.stage = 'follow_up';
    if (v('how')) act.note = `${v('how')}${act.note?' — '+act.note:''}`;
  } else if (t==='booked'){
    const pid = v('plotId'); if (!pid) return toast('Choose a plot to book.');
    const plot = plotById(pid);
    if (lead.plotId && lead.plotId !== pid) { const old = plotById(lead.plotId); if (old && old.leadId===lead.id) await Store.putPlot({ ...old, status:'available', leadId:'' }); }
    act.plotId = pid; act.amount = Number(v('amount'))||0; lead.plotId = pid; lead.tokenAmount = act.amount; lead.stage = 'booked'; lead.nextFollowUp = fuDate || '';
    if (plot) await Store.putPlot({ ...plot, status:'booked', leadId:lead.id });
  } else if (t==='deal_done'){
    act.amount = Number(v('amount'))||0; if (v('at')) act.at = new Date(v('at')+'T12:00:00').toISOString();
    lead.dealAmount = act.amount; lead.stage = 'deal_done'; lead.nextFollowUp = ''; lead.visitAt = '';
    const plot = plotById(lead.plotId); if (plot) await Store.putPlot({ ...plot, status:'sold', leadId:lead.id });
  } else if (t==='lost'){
    lead.stage = 'lost'; lead.nextFollowUp = ''; lead.visitAt = '';
    const plot = plotById(lead.plotId); if (plot && plot.leadId===lead.id && plot.status!=='sold') { await Store.putPlot({ ...plot, status:'available', leadId:'' }); lead.plotId = ''; }
  }
  logAct(lead, act);
  ui.action = null;
  await Store.putLead(lead);
  toast(`${ACTS[t].label} saved`);
}
async function moveStage(id, stage){
  const l = leadById(id); if (!l || l.stage===stage) return;
  if (stage==='booked' || stage==='deal_done') { ui.openLead = id; ui.action = stage; render(); return; }
  const lead = { ...l, stage };
  if (stage==='lost' || stage==='deal_done') { lead.nextFollowUp=''; }
  logAct(lead, { type:'stage', to:stage, note:'' });
  await Store.putLead(lead);
}

    const lines = new Map(); for (const it of items){ const k = Math.round(it.y / 4); if (!lines.has(k)) lines.set(k, []); lines.get(k).push(it); }

    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);

  if (site) ui.plotSite = site;
  closeOverlay(); render(); toast(`${added} plot${added===1?'':'s'} added${updated?`, ${updated} updated`:''} from ${Imp.file ? Imp.file.name : 'the plan'}`);
}

/* ===================== events ===================== */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-view],[data-go],[data-open],[data-close],[data-act],[data-act-cancel],[data-vtab],[data-quick],[data-plot],[data-me],[data-seed],[data-rm-member],[data-del-plot],#importBtn,#importStop,#importRetry,[data-login-mode],#signOutBtn,[data-rm-partner],[data-rm-invite],[data-money],[data-del-money],[data-kind],#addMoneyBtn,#exportMoneyBtn,#addLeadBtn,#addPlotBtn,#addMemberBtn,#editLead,#deleteLead,#meChip,#exportBtn,#exportBtn2,#clearSamples,[data-stop]');
  if (!t) return;
  if (t.dataset.stop) { e.stopPropagation(); return; }
  if (t.dataset.view || t.dataset.go) { ui.view = t.dataset.view || t.dataset.go; ui.openLead = null; $('#overlay').innerHTML=''; render(); window.scrollTo(0,0); return; }
  if (t.dataset.open) { e.preventDefault(); ui.openLead = t.dataset.open; ui.action = null; render(); return; }
  if (t.dataset.close) { if (t.classList.contains('modal') && e.target !== t) return; closeOverlay(); return; }
  if (t.dataset.act) { ui.action = ui.action === t.dataset.act ? null : t.dataset.act; renderDrawer(); return; }
  if (t.dataset.actCancel) { ui.action = null; renderDrawer(); return; }
  if (t.dataset.vtab) { ui.visitsTab = t.dataset.vtab; render(); return; }
  if (t.dataset.quick) { e.stopPropagation(); ui.openLead = t.dataset.lead; ui.action = t.dataset.quick; render(); return; }
  if (t.dataset.plot) { openModal(plotSheet(plotById(t.dataset.plot))); return; }
  if (t.dataset.loginMode) { e.preventDefault(); showLogin(t.dataset.loginMode); return; }
  if (t.id === 'signOutBtn') { Store.signOut(); return; }
  if (t.dataset.rmPartner) { if (confirm('Remove this partner? They will no longer be able to open the board. Their logged activity stays.')) Store.removePartner(t.dataset.rmPartner); return; }
  if (t.dataset.rmInvite) { Store.removeInvite(t.dataset.rmInvite); return; }
  if (t.dataset.delPlot) { if (confirm('Delete this plot?')) { await Store.deletePlot(t.dataset.delPlot); closeOverlay(); } return; }
  if (t.id === 'importBtn') { importModal(); return; }
  if (t.id === 'setRateBtn') { const n = state.plots.filter(p => !ui.plotSite || (p.site||'Unnamed site')===ui.plotSite).length; openModal(`<h2>Set rate</h2><p>Applies to all <b>${n}</b> plots ${ui.plotSite?`in ${esc(ui.plotSite)}`:'in inventory'}. Sold plots keep their rate.</p><form id="rateForm"><div class="form-grid"><div class="field"><label>Rate (₹ per ${unitLabel()})</label><input name="rate" type="number" min="1" step="any" required placeholder="${unitKey()==='ganda'?'e.g. 900000':'e.g. 1500'}"></div><div class="field"><label>Apply to</label><select name="scope"><option value="unset">Only plots with no rate</option><option value="all">All available and booked plots</option></select></div></div><div class="form-foot"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn primary" type="submit">Apply</button></div></form>`); return; }
  if (t.id === 'importStop') { if (Imp.abort) Imp.abort.abort(); Imp.step = 'pick'; renderImport(); return; }
  if (t.id === 'importRetry') { Imp.step = 'pick'; renderImport(); return; }
  if (t.id === 'importTextOnly') { Imp.result = normalizeResult(heuristicParse(Imp.texts)); Imp.method = 'text'; Imp.rows = Imp.result.plots; Imp.unit = Imp.result.areaUnit || unitKey(); Imp.step = 'review'; renderImport(); return; }
  if (t.dataset.money) { const m = state.money.find(x => x.id === t.dataset.money); if (m) openModal(moneyForm(m)); return; }
  if (t.dataset.delMoney) { if (confirm('Delete this entry?')) { await Store.deleteMoney(t.dataset.delMoney); closeOverlay(); toast('Entry deleted'); } return; }
  if (t.dataset.kind) { const f = t.closest('form'); f.elements.kind.value = t.dataset.kind; $$('[data-kind]', f).forEach(b => b.classList.toggle('on', b === t)); $('#catField', f).hidden = t.dataset.kind === 'investment'; return; }
  if (t.id === 'addMoneyBtn') { openModal(moneyForm(null)); return; }
  if (t.id === 'exportMoneyBtn') { exportCsv('money'); return; }
  if (t.id === 'addLeadBtn') { openModal(leadForm(null)); return; }
  if (t.id === 'addPlotBtn') { openModal(plotForm()); return; }
  if (t.id === 'addMemberBtn') { openModal(`<h2>Invite a partner</h2><p>They open this same page, choose “Create your password” with this email, and get full access.</p><form id="memberForm"><div class="form-grid"><div class="field"><label>Name</label><input name="name" required placeholder="Partner's name"></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="partner@gmail.com"></div></div><div class="form-foot"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn primary" type="submit">Invite</button></div></form>`); return; }
  if (t.id === 'editLead') { openModal(leadForm(leadById(ui.openLead))); return; }
  if (t.id === 'deleteLead') { const l = leadById(ui.openLead); if (l && confirm(`Delete ${l.name} and their whole history?`)) { const p = plotById(l.plotId); if (p && p.leadId===l.id && p.status!=='sold') await Store.putPlot({ ...p, status:'available', leadId:'' }); await Store.deleteLead(l.id); closeOverlay(); toast('Lead deleted'); } return; }
  if (t.id === 'meChip') { if (ME && confirm('Sign out of MyCoinMap on this device?')) Store.signOut(); return; }
  if (t.id === 'exportBtn' || t.id === 'exportBtn2') { exportCsv(); return; }
  if (t.id === 'clearSamples') { clearSamples(); return; }
});
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'leadForm') {
    const v = n => f.elements[n].value.trim();
    const id = f.dataset.id; const old = id ? leadById(id) : null;
    const lead = old ? { ...old } : { id:uid(), stage:'new', createdAt:new Date().toISOString(), activities:[], nextFollowUp:'', visitAt:'', plotId:'', tokenAmount:0, dealAmount:0 };
    Object.assign(lead, { name:v('name'), phone:v('phone'), source:v('source'), assignedTo:v('assignedTo'), interest:v('interest'), budget:Number(v('budget'))||0, notes:v('notes') });
    logAct(lead, { type: old ? 'edit' : 'created', note:'' });
    if (lead.assignedTo && !state.team.includes(lead.assignedTo)) await Store.putTeam([...state.team, lead.assignedTo]);
    await Store.putLead(lead);
    $('#overlay').innerHTML = ''; ui.openLead = lead.id; render(); toast(old ? 'Lead updated' : 'Lead added');
  } else if (f.id === 'actForm') {
    const l = leadById(ui.openLead); if (l) await submitAction(l, f.dataset.type, f);
  } else if (f.id === 'plotForm') {
    const v = n => f.elements[n].value.trim();
    const from = Number(v('from')), to = Math.max(Number(v('to')), Number(v('from')));
    if (to - from > 300) return toast('Add at most 300 plots at a time.');
    const size = Number(v('size')), rate = Number(v('rate'));
    for (let n = from; n <= to; n++) await Store.putPlot({ id:uid(), site:v('site'), number:v('prefix')+n, sizeSqft:Math.round(size*unitSqft()), areaValue:size, areaUnit:unitKey(), pricePerSqft:rate/unitSqft(), facing:v('facing'), status:'available', leadId:'' });
    closeOverlay(); toast(`${to-from+1} plot${to>from?'s':''} added`);
  } else if (f.id === 'plotEdit') {
    const v = n => f.elements[n].value.trim(); const p = plotById(f.dataset.id);
    const size = Number(v('size')), rate = Number(v('rate'));
    await Store.putPlot({ ...p, number:v('number'), status:v('status'), sizeSqft:Math.round(size*unitSqft()), areaValue:size, areaUnit:unitKey(), pricePerSqft:rate/unitSqft(), facing:v('facing'), site:v('site') });
    closeOverlay(); toast('Plot saved');
  } else if (f.id === 'rateForm') {
    const rate = Number(f.elements.rate.value) / unitSqft(); const scope = f.elements.scope.value; let n = 0;
    for (const p of state.plots) { if (ui.plotSite && (p.site||'Unnamed site')!==ui.plotSite) continue; if (p.status==='sold') continue; if (scope==='unset' && Number(p.pricePerSqft)>0) continue; await Store.putPlot({ ...p, pricePerSqft: rate }); n++; }
    closeOverlay(); toast(`Rate set on ${n} plot${n===1?'':'s'}`);
  } else if (f.id === 'importForm') {
    await commitImport(f);
  } else if (f.id === 'moneyForm') {
    const v = n => f.elements[n] ? f.elements[n].value.trim() : '';
    const old = f.dataset.id ? state.money.find(x => x.id === f.dataset.id) : null;
    const m = { ...(old || { id:uid(), by:ME||'Unknown', createdAt:new Date().toISOString() }), kind:v('kind'), amount:Number(v('amount'))||0, paidBy:v('paidBy'), category:v('kind')==='investment'?'':v('category'), on:new Date(v('on')+'T12:00:00').toISOString(), leadId:v('leadId'), plotId:v('plotId'), note:v('note') };
    if (!m.amount) return toast('Enter an amount.');
    if (m.paidBy && !state.team.includes(m.paidBy)) await Store.putTeam([...state.team, m.paidBy]);
    await Store.putMoney(m); closeOverlay(); toast(old ? 'Entry updated' : `${fmtINR(m.amount)} recorded for ${m.paidBy}`);
  } else if (f.id === 'loginForm') {
    const email = f.elements.email.value.trim(), password = f.elements.password.value; const msg = $('#loginMsg'); msg.textContent = 'Please wait…';
    if (f.dataset.mode === 'in') { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) msg.textContent = /invalid/i.test(error.message) ? 'Wrong email or password.' : error.message; }
    else { const { data, error } = await sb.auth.signUp({ email, password }); if (error) msg.textContent = error.message; else if (data.session) location.reload(); else msg.textContent = 'Check your email and open the confirmation link, then sign in here.'; }
  } else if (f.id === 'memberForm') {
    const n = f.elements.name.value.trim(), em = f.elements.email.value.trim(); if (!n || !em) return; await Store.invite(n, em); closeOverlay(); toast(`${n} invited`);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile') { const f = e.target.files && e.target.files[0]; if (!f) return; Imp.site = ($('#impSite') || {}).value || Imp.site; Imp.rate = Number(($('#impRate') || {}).value) || Imp.rate; runImport(f); return; }
  if (e.target.id === 'impUnit') { Imp.unit = e.target.value; Imp.site = e.target.form.elements.site.value; renderImport(); return; }
  if (e.target.dataset && e.target.dataset.inc !== undefined) { Imp.rows[Number(e.target.dataset.inc)].include = e.target.checked; renderImport(); return; }
  const s = e.target.closest('[data-filter]'); if (!s) return;
  if (s.dataset.filter==='stage') ui.filterStage = s.value; if (s.dataset.filter==='who') ui.filterWho = s.value; if (s.dataset.filter==='site') ui.plotSite = s.value; if (s.dataset.filter==='unit') { Store.putPrefs({ areaUnit: s.value }); return; } if (s.dataset.filter==='moneyWho') ui.moneyWho = s.value; if (s.dataset.filter==='moneyKind') ui.moneyKind = s.value; if (s.dataset.filter==='moneyMonth') ui.moneyMonth = s.value; render();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.f || el.dataset.i === undefined) return;
  const r = Imp.rows[Number(el.dataset.i)]; if (!r) return;
  const f = el.dataset.f;
  if (f === 'areaLocal') { const v = Number(el.value) || 0; r.areaValue = v || null; r.areaUnit = v ? Imp.unit : ''; r.sizeSqft = Math.round(v * UNITS[Imp.unit].sqft); const sz = $(`[data-f="sizeSqft"][data-i="${el.dataset.i}"]`); if (sz) sz.value = r.sizeSqft; return; }
  r[f] = (f === 'number' || f === 'facing') ? el.value.trim() : (Number(el.value) || (f === 'sizeSqft' ? 0 : null));
  if (f === 'sizeSqft') { r.areaValue = null; r.areaUnit = ''; const al = $(`[data-f="areaLocal"][data-i="${el.dataset.i}"]`); if (al) al.value = +(r.sizeSqft / UNITS[Imp.unit].sqft).toFixed(3); }
  if ((f === 'widthFt' || f === 'depthFt') && r.widthFt && r.depthFt) { r.sizeSqft = Math.round(r.widthFt * r.depthFt); const sz = $(`[data-f="sizeSqft"][data-i="${el.dataset.i}"]`); if (sz) sz.value = r.sizeSqft; }
});
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#dropZone'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#dropZone'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#dropZone'); if (!z) return; e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { Imp.site = ($('#impSite') || {}).value || Imp.site; Imp.rate = Number(($('#impRate') || {}).value) || Imp.rate; runImport(f); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay').innerHTML && !ui.locked) closeOverlay(); });
$('#search').addEventListener('input', e => { ui.q = e.target.value.trim(); if (!['board','leads','plots','money'].includes(ui.view)) ui.view = 'leads'; render(); });
/* drag & drop on the board */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest('.kcard'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch {} });
document.addEventListener('dragend', e => { const c = e.target.closest('.kcard'); if (c) c.classList.remove('dragging'); $$('.col.over').forEach(c => c.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); $$('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('dragleave', e => { const col = e.target.closest('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; col.classList.remove('over'); moveStage(id, col.dataset.stage); });

/* ===================== boot ===================== */
$('#searchIco').innerHTML = I.search; $('#plusIco').innerHTML = I.plus;
render();
downloads = { save: async ({ filename, data }) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type:'text/csv' })); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } };
Store.init();
</script>
